# Production stack for the server.
#
# The server does NOT build the site. GitHub Actions builds it and publishes
# the finished files to the `deploy` branch; ./site is a checkout of that
# branch, bind-mounted straight into nginx. Deploying is:
#
#   cd /opt/hyperporter/site && git fetch --depth 1 origin deploy \
#     && git reset --hard origin/deploy
#
# That is a few seconds. It used to be `docker compose up -d --build`, which
# ran the whole Astro build on a 956MB box that was serving traffic at the
# same time — it swapped and crawled. See .github/workflows/deploy.yml.
#
# Because ./site is a bind mount of static files, nginx picks up a new build
# immediately; no restart, no rebuild, no downtime.
#
# First time only, run scripts/init-letsencrypt.sh first — see DEPLOY.md.

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # The built site, as published by CI to the `deploy` branch.
      - ./site:/usr/share/nginx/html:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    # Reload periodically so a certificate renewed by the certbot service is
    # picked up without a manual restart.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Renews certificates in the background. The webroot it writes to is the
  # same one nginx serves /.well-known/acme-challenge/ from.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
