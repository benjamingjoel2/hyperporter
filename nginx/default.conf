# Hyperporter — static site served by nginx.
#
# Three server blocks: HTTP (ACME challenge + redirect to HTTPS), HTTPS for
# www (redirect to apex), and HTTPS for the apex domain (the actual site).
#
# Note on first boot: the HTTPS blocks reference certificate files that do
# not exist until certbot has issued them, and nginx refuses to start if an
# ssl_certificate path is missing. scripts/init-letsencrypt.sh writes a
# temporary self-signed cert first to break that deadlock — run it once,
# before the first `docker compose up`. See DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name hyperporter.com www.hyperporter.com;

    # Must stay on plain HTTP and must not be redirected — this is how
    # Let's Encrypt verifies the domain, on both issue and renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hyperporter.com$request_uri;
    }
}

# www -> apex, so there is exactly one canonical origin. The site's
# canonical tags all point at the apex (see SITE_URL in astro.config.mjs).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hyperporter.com;

    ssl_certificate     /etc/letsencrypt/live/hyperporter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyperporter.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hyperporter.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hyperporter.com;

    ssl_certificate     /etc/letsencrypt/live/hyperporter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyperporter.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # Astro's static build emits directory-style pages
    # (/autopilot/index.html), so a request for /autopilot has to fall
    # through to the directory before 404ing. The $uri.html arm covers
    # top-level files like /robots.txt already handled by $uri, and any
    # future flat .html output.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets never change content under the same name.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The hero photo is a plain static asset (not content-hashed), so give
    # it a shorter TTL than /_astro/ — a replacement keeps the same name.
    location = /hero.jpg {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Serves the branded 404 page built by src/pages/404.astro, while still
    # returning a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml application/xml+rss;

    # Baseline hardening. No CSP here: the site inlines small scripts and
    # style attributes and loads Google Fonts, so a policy tight enough to
    # be worth having needs to be written against the real build rather
    # than guessed at.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
