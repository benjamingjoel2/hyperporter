# Builds the site here, on GitHub's runners, and publishes the finished
# files to the `deploy` branch.
#
# The server used to run this same build itself. It has 956MB of RAM and the
# build peaks around 740MB while nginx is also serving traffic, so it swapped
# to disk and crawled rather than failing outright — a deploy that ran for
# twenty minutes and never finished. GitHub's runners have 16GB, and were
# already building this on every push anyway.
#
# So the server no longer builds anything. It checks out the `deploy` branch
# and nginx serves those files directly. Deploying is a git pull.
#
# The branch is force-pushed as a single fresh commit each time, so it holds
# the current build and nothing else — otherwise the repository would grow by
# a full copy of the site on every deploy.
#
# Once the deploy branch is published, the last steps SSH to the server, pull
# that branch, and confirm the live site serves this exact commit.
#
# There are two ways the server can end up with that build, and the repository
# variable DEPLOY_MODE picks between them:
#
#   push (the default) — this workflow SSHes in and pulls. Needs the two
#     secrets in DEPLOY.md.
#   pull — the server checks GitHub itself once a minute
#     (scripts/enable-auto-deploy.sh). No secrets, no key, nothing reaching
#     into the server from outside. The SSH steps are skipped and the run
#     waits for the live site to come up on the new build instead.
#
# Either way the run is green only once https://hyperporter.com/build.txt
# returns the commit that was just built.
#
# Those steps used to be gated on `if: env.DEPLOY_SSH_KEY != ''`, which meant
# that with the secret unset they skipped and the run still went green. Four
# runs reported success between 8 and 13 September 2026 while the live site
# sat on its 5 September build and nobody had reason to look. A deploy
# pipeline that passes without deploying is worse than one that fails, so a
# missing secret is now an error. Forks, which have no secrets and no server,
# stop after publishing instead. See DEPLOY.md for the one-time setup.
name: Deploy

on:
  push:
    branches: [main]
  # so a deploy can be re-run from the Actions tab without pushing anything
  workflow_dispatch:

# needed to push the built files back to the repository
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  # Required on this repository; the guard step below fails without it.
  DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'hyperporter.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/hyperporter/site' }}
  # 'push' (this workflow SSHes in) or 'pull' (the server polls for itself).
  DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'push' }}

jobs:
  build-and-publish:
    name: Build, publish, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: astro check
        run: npx astro check

      - name: astro build
        run: npx astro build
        env:
          # Baked into canonicals, OG URLs, the sitemap and robots.txt, so it
          # has to match the origin nginx actually serves.
          SITE_URL: https://hyperporter.com

      - name: Fail if the build looks wrong
        # A publish of an empty or half-built dist would take the site down,
        # and force-pushing it would leave nothing to roll back to.
        run: |
          test -f dist/index.html || { echo "no dist/index.html"; exit 1; }
          count=$(find dist -name '*.html' | wc -l)
          echo "$count HTML pages built"
          [ "$count" -ge 150 ] || { echo "only $count pages — expected 150+"; exit 1; }

      - name: Stamp the build
        # The live check below reads this back over HTTPS, so a deploy only
        # passes when the server is serving this commit and not the last one.
        run: echo "$GITHUB_SHA" > dist/build.txt

      - name: Publish to the deploy branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:deploy

      - name: Require the deploy credentials
        # Placed after the publish on purpose: the deploy branch is already
        # updated by the time this runs, so failing here still leaves a build
        # to pull by hand. It only stops the run claiming a success it has
        # not earned.
        if: github.repository == 'benjamingjoel2/hyperporter' && vars.DEPLOY_MODE != 'pull'
        run: |
          missing=
          [ -n "$DEPLOY_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "The build is published to the deploy branch, but nothing pulled it, so"
            echo "the live site is UNCHANGED. Add the secret(s) under Settings -> Secrets"
            echo "and variables -> Actions (DEPLOY.md, 'First-time server setup' step 3),"
            echo "then re-run this workflow. To deploy this build by hand meanwhile:"
            echo "  ssh $DEPLOY_USER@$DEPLOY_HOST 'cd $DEPLOY_PATH && git fetch --depth 1 origin deploy && git reset --hard origin/deploy'"
            exit 1
          fi

      - name: Pull the deploy branch on the server
        if: github.repository == 'benjamingjoel2/hyperporter' && vars.DEPLOY_MODE != 'pull'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && git fetch --depth 1 origin deploy && git reset --hard origin/deploy"
          rm -f ~/.ssh/deploy_key

      - name: Confirm the live site serves this build
        if: github.repository == 'benjamingjoel2/hyperporter'
        run: |
          # In pull mode the server checks once a minute, so give it three.
          tries=6; wait=5
          if [ "$DEPLOY_MODE" = pull ]; then tries=36; wait=5; fi
          i=0
          while [ "$i" -lt "$tries" ]; do
            live=$(curl -fsS --max-time 15 "https://$DEPLOY_HOST/build.txt" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "live site serves $live"; exit 0; fi
            i=$((i + 1)); sleep "$wait"
          done
          echo "::error::The live site serves '$live', not $GITHUB_SHA."
          if [ "$DEPLOY_MODE" = pull ]; then
            echo "The server pulls for itself in this mode. Check the job on the box:"
            echo "  systemctl status hyperporter-pull.timer"
            echo "  /usr/local/bin/hyperporter-pull && echo pulled"
          fi
          exit 1
