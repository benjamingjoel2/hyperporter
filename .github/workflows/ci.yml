name: CI

# Guards pull requests. Pushes to main are covered by deploy.yml, which runs
# the same check and build before publishing, so running both there would
# just build the site twice.
on:
  pull_request:

jobs:
  build:
    name: astro check && astro build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: astro check
        run: npx astro check

      - name: astro build
        run: npx astro build
